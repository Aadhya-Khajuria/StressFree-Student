<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <link rel="stylesheet" href="styles.css" />
    <nav>
      <a href="index.html" class="logo">StressFree Student</a>

      <ul class="nav-links">
        <li><a href="Mood-Journal.html">Mood Journal</a></li>
        <li><a href="Calming-activities.html">Calming Activities</a></li>
        <li><a href="study.strategies.html">Study Strategies</a></li>
        <li><a href="study.planner.html">Study Planner</a></li>
      </ul>
    </nav>

    <h1>Study Planner</h1>
    <div class="top">
      <section class="studyTimer">
        <iframe
          id="timer"
          src="https://studywithme.io/aesthetic-pomodoro-timer/"
          style="border: 0"
          width="300"
          height="350"
          frameborder="0"
          scrolling="no"
        ></iframe>
      </section>
      <iframe
        data-testid="embed-iframe"
        style="border-radius: 12px"
        src="https://open.spotify.com/embed/playlist/3tVn8zUOCMV5hfT8NRyHoJ?utm_source=generator&si=cb3bbf0872c842bc"
        width="300"
        height="352"
        frameborder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"
      ></iframe>
      <iframe
        data-testid="embed-iframe"
        style="border-radius: 12px"
        src="https://open.spotify.com/embed/album/1PiqaSNptT2HN7Znz16fiK?utm_source=generator&si=6173fcf40ae741f2"
        width="300"
        height="352"
        frameborder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"
      ></iframe>
      <iframe
        data-testid="embed-iframe"
        style="border-radius: 12px"
        src="https://open.spotify.com/embed/playlist/07lYUEyTkWP3NqIa7Kzyqx?utm_source=generator&si=3a95c72da4cf400f"
        width="300"
        height="352"
        frameborder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"
      ></iframe>
    </div>
    <div class="secondContainer">
      <div class="second">
        <h2>Notes:</h2>
        <textarea
          id="notes"
          rows="8"
          placeholder="Write your notes here......."
        ></textarea>
      </div>
      <div class="second">
        <h2>Goals:</h2>
        <textarea
          id="goals"
          rows="8"
          placeholder="Write your goals here......."
        ></textarea>
      </div>
      <div class="second">
        <h2>Events:</h2>
        <textarea
          id="events"
          rows="8"
          placeholder="Write your upcomming events here......."
        ></textarea>
      </div>
      <div class="second">
        <h2>Appointments:</h2>
        <textarea
          id="appointment"
          rows="8"
          placeholder="Write your upcoming appointments here......."
        ></textarea>
      </div>
    </div>

    <section class="fullWeek">
      <div class="meow">
        <button>Weekly Planner</button>
      </div>
      <section class="planner">
        <div class="days">
          <button type="sunday">Sunday:</button>
          <button type="monday">Monday:</button>
          <button type="tuesday">Tuesday:</button>
          <button type="wednesday">Wednesday:</button>
          <button type="thursday">Thursday:</button>
          <button type="friday">Friday:</button>
          <button type="saturday">Saturday:</button>
        </div>
        <div class="week">
          <textarea id="sunday" rows="20" placeholder="Sunday"></textarea>
          <textarea id="monday" rows="20" placeholder="Monday"></textarea>
          <textarea id="tuesday" rows="20" placeholder="Tuesday"></textarea>
          <textarea id="wednesday" rows="20" placeholder="Wednesday"></textarea>
          <textarea id="thursday" rows="20" placeholder="Thursday"></textarea>
          <textarea id="friday" rows="20" placeholder="Friday"></textarea>
          <textarea id="saturday" rows="20" placeholder="Saturday"></textarea>
        </div>
        <button id="savePlanner">Save Planner</button>
      </section>
    </section>
    <script src="script.js"></script>
  </body>
</html>
