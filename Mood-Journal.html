<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mood Journal | Stress Free Student</title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://googleapis.com" rel="stylesheet" />
  </head>
  <body>
    <nav>
      <a href="index.html" class="logo">Stress Free Student</a>
      <ul class="nav-links">
        <li><a href="Mood-Journal.html">Mood Journal</a></li>
        <li><a href="Calming-activities.html">Calming Activities</a></li>
        <li><a href="study.strategies.html">Study Strategies</a></li>
        <li><a href="study.planner.html">Study Planner</a></li>
      </ul>
    </nav>

    <main>
      <h1>Mood Journal</h1>

      <div class="journal-card">
        <div class="section">
          <label for="date">Date</label>
          <input type="date" id="date" />
        </div>

        <div class="section">
          <h2>How are you feeling today?</h2>
          <div class="mood-options">
            <button type="button">😣</button>
            <button type="button">😔</button>
            <button type="button">😐</button>
            <button type="button">😊</button>
            <button type="button">😁</button>
          </div>
        </div>

        <div class="section">
          <h2>Energy Level</h2>
          <div class="energy-options">
            <button type="button">🔋</button>
            <button type="button">🔋🔋</button>
            <button type="button">🔋🔋🔋</button>
            <button type="button">🔋🔋🔋🔋</button>
            <button type="button">🔋🔋🔋🔋🔋</button>
          </div>
        </div>

        <div class="section">
          <h2>Stress Level</h2>
          <div class="stress-options">
            <button type="button">Low</button>
            <button type="button">Medium</button>
            <button type="button">High</button>
          </div>
        </div>

        <div class="section">
          <label for="song-input"
            ><h2>What song is stuck in your head?</h2></label
          >
          <input
            type="text"
            id="song-input"
            placeholder="Type a song title..."
          />
        </div>

        <div class="section">
          <label for="mind-input"><h2>What's on your mind?</h2></label>
          <textarea
            id="mind-input"
            rows="6"
            placeholder="Write anything you'd like..."
          ></textarea>
        </div>

        <div class="section">
          <label for="grateful-input"
            ><h2>One thing I'm grateful for</h2></label
          >
          <textarea
            id="grateful-input"
            rows="3"
            placeholder="Today I'm grateful for..."
          ></textarea>
        </div>

        <div class="section">
          <label for="goal-input"><h2>Goal for tomorrow</h2></label>
          <textarea
            id="goal-input"
            rows="3"
            placeholder="What's one thing you'd like to achieve?"
          ></textarea>
        </div>

        <div class="section save-section">
          <button type="button" class="save-button">Save Entry</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
